services:

  mongodb:
    image: mongodb/mongodb-community-server:6.0.10-ubi9
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - /Users/pabloramosizquierdo/Desktop/Pablo/Tecnologias/Dockers/MongoDB/data:/data/db
    networks:
      - mongo-api

  jenkins:
    build:
      context: infrastructure/jenkins/.
      dockerfile: Dockerfile
    image: jenkins-pablo:v1.0
    container_name: jenkins
    ports:
      - "8090:8090"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8090
    volumes:
      - /Users/pabloramosizquierdo/Desktop/Pablo/Tecnologias/Dockers/Jenkins/jenkins_home:/var/jenkins_home
    networks:
      - mongo-api

  nexus:
    image: sonatype/nexus3:3.82.0-alpine
    container_name: nexus
    ports:
      - "8081:8081"
    volumes:
      - /Users/pabloramosizquierdo/Desktop/Pablo/Tecnologias/Dockers/Nexus/nexus_data:/nexus-data
    networks:
      - mongo-api

networks:
  mongo-api:
    driver: bridge